<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linden Pilates - Studio Booking</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f9f9f8; color: #2c2c2c; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-6 space-y-6">
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-semibold tracking-tight text-stone-800">Linden Pilates</h1>
            <p class="text-sm text-stone-500">Private Studio Booking System</p>
        </div>

        <!-- Booking Form Container -->
        <form id="bookingForm" class="space-y-4">
            <!-- Name -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="Enter your name">
            </div>

            <!-- Phone -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Phone Number</label>
                <input type="tel" id="phone" required class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="e.g. 96141012">
            </div>

            <!-- Session Type -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Session Type</label>
                <select id="session_type" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm bg-white focus:outline-none focus:ring-1 focus:ring-stone-400">
                    <option value="Trial Session">Trial Session</option>
                    <option value="Private Session">Private Session</option>
                </select>
            </div>

            <!-- Date & Time Row -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">Date</label>
                    <input type="text" id="session_date" required class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="e.g. Tue 6 Oct">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-600 mb-1">Time</label>
                    <input type="text" id="session_time" required class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="e.g. 1:00 PM">
                </div>
            </div>

            <!-- Experience -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Pilates Experience</label>
                <input type="text" id="experience" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="e.g. 6 months / Beginner">
            </div>

            <!-- Notes / Goals -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Goals / Special Requests</label>
                <textarea id="notes" rows="2" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="Lower back pain relief, core stability, etc."></textarea>
            </div>

            <!-- PIN (Optional for members) -->
            <div>
                <label class="block text-xs font-medium text-stone-600 mb-1">Member PIN (Optional)</label>
                <input type="password" id="pin" maxlength="4" class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-stone-400" placeholder="4-digit PIN if applicable">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-stone-900 text-white rounded-lg text-sm font-medium hover:bg-stone-800 transition">
                Confirm Booking
            </button>
        </form>

        <!-- Status Message -->
        <div id="responseMessage" class="text-center text-xs text-stone-500 hidden"></div>
    </div>

    <script>
        // 최신 배포된 Google Apps Script Web App URL 연결 (본인의 배포 URL로 유지)
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzmhd1ExBjUrGHbRbKYa4uFsQpPikJA058x-0lutNEeHeAfZxA26xD4pbwWaF11ZIMEhw/exec';

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('responseMessage');
            
            btn.disabled = true;
            btn.textContent = 'Processing...';
            msg.classList.add('hidden');

            const payload = {
                action: 'book',
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                session_type: document.getElementById('session_type').value,
                session_date: document.getElementById('session_date').value,
                session_time: document.getElementById('session_time').value,
                experience: document.getElementById('experience').value,
                notes: document.getElementById('notes').value,
                pin: document.getElementById('pin').value,
                reference: 'YP-' + Math.random().toString(36).substring(2, 8).toUpperCase(),
                status: 'pending'
            };

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.ok) {
                    msg.textContent = 'Booking confirmed successfully! Confirmation email has been sent.';
                    msg.className = 'text-center text-xs text-emerald-600 font-medium';
                    msg.classList.remove('hidden');
                    document.getElementById('bookingForm').reset();
                } else {
                    // 중복 예약이나 세션 부족 등의 서버 에러 메시지 표시
                    msg.textContent = result.error || 'Booking failed. Please try again.';
                    msg.className = 'text-center text-xs text-rose-600 font-medium';
                    msg.classList.remove('hidden');
                }
            } catch (error) {
                msg.textContent = 'Network error or booking failed. Please try again.';
                msg.className = 'text-center text-xs text-rose-600 font-medium';
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Confirm Booking';
            }
        });
    </script>
</body>
</html>
